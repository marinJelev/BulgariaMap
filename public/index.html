<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Пътеки — Bulgaria Travel Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">Пътеки</span>
    <span class="brand-sub">&ldquo;Take the road less traveled&rdquo;</span>
  </div>
  <div class="topbar-right">
    <div class="layer-chips">
      <button type="button" class="layer-chip active" id="toggle-cities-layer" aria-pressed="true">📍 Cities</button>
      <button type="button" class="layer-chip active" id="toggle-sites-layer" aria-pressed="true">⭐ 100 Sites</button>
    </div>
  </div>
</header>

<div class="layout">
  <div id="map"></div>

  <aside id="sidebar">
    <div class="tabs">
      <button class="tab-btn active" data-tab="sites">100 Sites</button>
      <button class="tab-btn" data-tab="cities">Cities</button>
    </div>

    <section class="tab-panel active" id="tab-sites">
      <div class="progress-block">
        <div class="progress-header">
          <span class="progress-count"><span id="sites-points-visited">0</span> / 100 points <span class="progress-subcount">(<span id="sites-attractions-visited">0</span> / <span id="sites-attractions-total">–</span> sites)</span></span>
        </div>
        <div class="progress-bar"><div class="progress-bar-fill" id="sites-progress-fill"></div></div>
        <div class="badges">
          <div class="badge" id="badge-bronze" data-threshold="25">
            <span class="badge-icon">🥉</span><span class="badge-label">Bronze<br/>25</span>
          </div>
          <div class="badge" id="badge-silver" data-threshold="50">
            <span class="badge-icon">🥈</span><span class="badge-label">Silver<br/>50</span>
          </div>
          <div class="badge" id="badge-gold" data-threshold="100">
            <span class="badge-icon">🥇</span><span class="badge-label">Gold<br/>100</span>
          </div>
        </div>
      </div>
      <input type="search" id="sites-search" class="search-box" placeholder="Search sites or towns…" />
      <ul id="sites-list" class="group-list"><li class="empty">Loading sites…</li></ul>
    </section>

    <section class="tab-panel" id="tab-cities">
      <div class="progress-block">
        <div class="progress-header">
          <span class="progress-count"><span id="cities-visited-count">0</span> / <span id="cities-total-count">–</span> visited</span>
        </div>
        <div class="progress-bar"><div class="progress-bar-fill" id="cities-progress-fill"></div></div>
      </div>
      <input type="search" id="cities-search" class="search-box" placeholder="Search cities…" />
      <ul id="cities-list" class="item-list"><li class="empty">Loading cities…</li></ul>
    </section>
  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
