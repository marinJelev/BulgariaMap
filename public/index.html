<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Пътеки — Bulgaria Travel Map</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">Пътеки</span>
    <span class="brand-sub">&ldquo;Take the road less travelled&rdquo;</span>
  </div>
  <div class="topbar-right">
    <div class="layer-chips">
      <button type="button" class="layer-chip active" id="toggle-cities-layer" aria-pressed="true">📍 Cities</button>
      <button type="button" class="layer-chip active" id="toggle-sites-layer" aria-pressed="true">⭐ 100 Sites</button>
    </div>
    <div class="auth-widget">
      <button type="button" class="auth-avatar hidden" id="auth-avatar" aria-haspopup="true" aria-expanded="false"></button>
      <div class="auth-account-panel hidden" id="auth-account-panel">
        <div class="auth-account-email" id="auth-email-display"></div>
        <button type="button" class="auth-signout" id="auth-signout">Sign out</button>
      </div>
    </div>
  </div>
</header>

<div class="auth-modal-overlay" id="auth-modal-overlay">
  <div class="auth-modal">
    <div class="auth-modal-brand">
      <span class="brand-mark">Пътеки</span>
      <p class="auth-modal-tagline">Sign in to start tracking your journey across Bulgaria.</p>
    </div>
    <div class="auth-tabs" role="tablist">
      <button type="button" class="auth-tab active" data-mode="signin" role="tab" aria-selected="true">Sign in</button>
      <button type="button" class="auth-tab" data-mode="signup" role="tab" aria-selected="false">Sign up</button>
    </div>
    <form id="auth-form" novalidate>
      <input type="email" id="auth-email" class="search-box" placeholder="Email" autocomplete="email" required />
      <input type="password" id="auth-password" class="search-box" placeholder="Password" autocomplete="current-password" required />
      <input type="password" id="auth-password-confirm" class="search-box hidden" placeholder="Confirm password" autocomplete="new-password" />
      <button type="button" class="auth-forgot-link" id="auth-forgot-link">Forgot password?</button>
      <button type="button" class="auth-back-link hidden" id="auth-back-link">← Back to sign in</button>
      <div class="auth-message" id="auth-message" role="status" aria-live="polite"></div>
      <button type="submit" class="auth-submit" id="auth-submit">Sign in</button>
    </form>
  </div>
</div>


<div class="layout">
  <div id="map"></div>

  <aside id="sidebar">
    <div class="tabs">
      <button class="tab-btn active" data-tab="sites">100 Sites</button>
      <button class="tab-btn" data-tab="cities">Cities</button>
    </div>

    <section class="tab-panel active" id="tab-sites">
      <div class="progress-block">
        <div class="progress-header">
          <span class="progress-count"><span id="sites-points-visited">0</span> / 100 points <span class="progress-subcount">(<span id="sites-attractions-visited">0</span> / <span id="sites-attractions-total">–</span> sites)</span></span>
        </div>
        <div class="progress-bar"><div class="progress-bar-fill" id="sites-progress-fill"></div></div>
        <div class="badges">
          <div class="badge" id="badge-bronze" data-threshold="25">
            <span class="badge-icon">🥉</span><span class="badge-label">Bronze<br/>25</span>
          </div>
          <div class="badge" id="badge-silver" data-threshold="50">
            <span class="badge-icon">🥈</span><span class="badge-label">Silver<br/>50</span>
          </div>
          <div class="badge" id="badge-gold" data-threshold="100">
            <span class="badge-icon">🥇</span><span class="badge-label">Gold<br/>100</span>
          </div>
        </div>
      </div>
      <input type="search" id="sites-search" class="search-box" placeholder="Search sites or towns…" />
      <ul id="sites-list" class="group-list"><li class="empty">Loading sites…</li></ul>
    </section>

    <section class="tab-panel" id="tab-cities">
      <div class="progress-block">
        <div class="progress-header">
          <span class="progress-count"><span id="cities-visited-count">0</span> / <span id="cities-total-count">–</span> visited</span>
        </div>
        <div class="progress-bar"><div class="progress-bar-fill" id="cities-progress-fill"></div></div>
      </div>
      <input type="search" id="cities-search" class="search-box" placeholder="Search cities…" />
      <ul id="cities-list" class="item-list"><li class="empty">Loading cities…</li></ul>
    </section>
  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
